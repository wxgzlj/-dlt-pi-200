name: DLT-PI-200 power planning

on:
  push:
    branches: [main]
    paths:
      - "src/power_analysis.py"
      - "POWER_ANALYSIS_PLAN.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  power-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run power-analysis unit tests
        run: python -m unittest discover -s tests -p 'test_power_analysis.py' -v
      - name: Run 100,000 Monte Carlo replicates per scenario
        run: python src/power_analysis.py --simulations 100000 --seed 2026112101 --output results/power_analysis_preliminary.json
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlt-pi-200-power-analysis
          path: results/power_analysis_preliminary.json
          if-no-files-found: error
      - name: Commit reproducible report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/power_analysis_preliminary.json
          if git diff --cached --quiet; then
            echo "No report change."
            exit 0
          fi
          git commit -m "Publish preliminary Monte Carlo power report"
          git push
